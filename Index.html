
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Antietam Command</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{

  margin:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#101419;

  color:#eee;

  font-family:Arial,Helvetica,sans-serif;

  touch-action:none

}

#game{

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

}

#top{

  height:62px;

  flex:none;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:7px 10px;

  background:#171c21;

  border-bottom:2px solid #303840;

  z-index:10;

}

.title{

  font-weight:800;

  font-size:19px;

  letter-spacing:.5px;

}

.subtitle{

  font-size:11px;

  color:#9da7b0;

  margin-top:2px

}

.controls{

  display:flex;

  gap:6px;

}

button{

  border:1px solid #59636d;

  background:#252c33;

  color:white;

  border-radius:9px;

  padding:10px 13px;

  font-weight:800;

  font-size:13px;

}

button:active{transform:scale(.96)}

#play{

  background:#2d6b39;

  border-color:#67a772;

}

#reset{

  background:#46332a;

}

#mapWrap{

  position:relative;

  flex:1;

  min-height:0;

  background:#7f9a66;

}

#map{

  width:100%;

  height:100%;

  display:block;

}

#bottom{

  height:91px;

  flex:none;

  background:#171c21;

  border-top:2px solid #303840;

  padding:8px 11px;

  display:flex;

  align-items:center;

  gap:12px;

}

#info{

  flex:1;

  min-width:0;

}

#selected{

  font-weight:800;

  font-size:15px;

}

#stats{

  color:#c1c8cd;

  font-size:12px;

  margin-top:4px;

}

#message{

  color:#e2b66d;

  font-size:11px;

  margin-top:5px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

#hint{

  text-align:center;

  color:#c8d0d4;

  font-size:11px;

  width:110px;

  line-height:1.3;

}

.unit{

  cursor:pointer;

}

.unitBody{

  stroke:#171b1e;

  stroke-width:3;

}

.union .unitBody{fill:#356da1}

.confed .unitBody{fill:#98443d}

.selected .unitBody{

  stroke:#ffe27b;

  stroke-width:5;

}

.unitText{

  fill:#fff;

  font-size:12px;

  font-weight:bold;

  text-anchor:middle;

  pointer-events:none;

}

.strengthBar{

  fill:#20252a;

}

.strengthFill{

  fill:#79bd69;

}

.objective{

  fill:#d7bd66;

  stroke:#42391f;

  stroke-width:3;

}

.objectiveText{

  fill:#302b1d;

  font-size:12px;

  font-weight:bold;

  text-anchor:middle;

}

.landmark{

  fill:#dfd6b9;

  stroke:#514b3e;

  stroke-width:3;

}

.landmarkText{

  fill:#292b28;

  font-size:12px;

  font-weight:bold;

}

.road{

  fill:none;

  stroke:#c7aa79;

  stroke-width:18;

  opacity:.8;

}

.roadEdge{

  fill:none;

  stroke:#806e51;

  stroke-width:2;

  opacity:.8;

}

.woods{

  fill:#5d784e;

  opacity:.7;

}

.field{

  fill:#a8ad70;

  opacity:.45;

}

.creek{

  fill:#668ba0;

  opacity:.95;

}

.creekEdge{

  fill:none;

  stroke:#405d6b;

  stroke-width:3;

}

.bridge{

  fill:#9a7654;

  stroke:#493a2c;

  stroke-width:4;

}

.arrow{

  fill:none;

  stroke:#ffe27b;

  stroke-width:5;

  stroke-linecap:round;

  stroke-linejoin:round;

  stroke-dasharray:12 8;

}

.arrowHead{

  fill:#ffe27b;

}

.capture{

  fill:none;

  stroke:#fff0a0;

  stroke-width:3;

  stroke-dasharray:6 5;

}

</style>

</head>

<body>

<div id="game">

  <div id="top">

    <div>

      <div class="title">ANTietam COMMAND</div>

      <div class="subtitle">Battlefield Prototype • v0.2</div>

    </div>

    <div class="controls">

      <button id="play">▶ PLAY</button>

      <button id="reset">↻ RESET</button>

    </div>

  </div>

  <div id="mapWrap">

    <svg id="map"

         viewBox="0 0 1000 650"

         preserveAspectRatio="xMidYMid meet">

      <!-- TERRAIN -->

      <rect x="0" y="0" width="1000" height="650" fill="#879c68"/>

      <path class="field"

            d="M0 0H310V190H0ZM0 400H300V650H0ZM700 0H1000V180H700ZM740 410H1000V650H740Z"/>

      <!-- Woods -->

      <path class="woods"

            d="M70 80

               C100 40 150 45 170 80

               C205 50 250 80 245 120

               C280 135 270 180 235 188

               L70 185

               C35 165 38 105 70 80Z"/>

      <path class="woods"

            d="M760 70

               C800 35 845 50 855 80

               C900 40 960 65 950 110

               C990 135 970 185 925 190

               L765 185

               C730 160 730 105 760 70Z"/>

      <path class="woods"

            d="M60 465

               C95 430 145 445 160 475

               C195 450 240 475 230 515

               C270 545 235 590 195 588

               L65 585

               C30 560 35 495 60 465Z"/>

      <path class="woods"

            d="M790 450

               C830 420 875 445 880 475

               C925 445 970 475 955 515

               C985 550 950 590 910 585

               L785 580

               C755 550 760 480 790 450Z"/>

      <!-- ROADS -->

      <path class="road" d="M80 325 C260 310 400 315 610 330 C760 340 870 325 960 300"/>

      <path class="roadEdge" d="M80 325 C260 310 400 315 610 330 C760 340 870 325 960 300"/>

      <path class="road" d="M390 20 C410 140 405 230 430 320 C455 420 480 515 500 640"/>

      <path class="roadEdge" d="M390 20 C410 140 405 230 430 320 C455 420 480 515 500 640"/>

      <!-- ANTIETAM CREEK -->

      <path class="creek"

        d="M620 0

           C590 65 655 105 615 170

           C580 230 650 275 610 335

           C575 390 650 430 605 490

           C570 540 650 590 610 650

           L690 650

           C725 585 650 545 690 485

           C725 425 655 390 695 330

           C735 275 660 225 700 165

           C735 105 660 65 700 0Z"/>

      <path class="creekEdge"

        d="M620 0

           C590 65 655 105 615 170

           C580 230 650 275 610 335

           C575 390 650 430 605 490

           C570 540 650 590 610 650"/>

      <!-- BURNSIDE BRIDGE -->

      <rect class="bridge" x="585" y="505" width="140" height="42" rx="5"/>

      <text x="655" y="531" text-anchor="middle"

            fill="#fff" font-size="14" font-weight="bold">

        BURNSIDE BRIDGE

      </text>

      <!-- DUNKER CHURCH -->

      <rect class="landmark" x="275" y="135" width="125" height="75" rx="4"/>

      <polygon points="265,135 410,135 338,92" fill="#cfc5a6" stroke="#514b3e" stroke-width="3"/>

      <text class="landmarkText" x="285" y="160">DUNKER</text>

      <text class="landmarkText" x="285" y="177">CHURCH</text>

      <!-- SHARPSBURG -->

      <rect class="landmark" x="95" y="285" width="120" height="55" rx="4"/>

      <text class="landmarkText" x="112" y="318">SHARPSBURG</text>

      <!-- OBJECTIVES -->

      <g id="obj1">

        <circle class="objective" cx="475" cy="170" r="27"/>

        <text class="objectiveText" x="475" y="174">NORTH</text>

      </g>

      <g id="obj2">

        <circle class="objective" cx="520" cy="360" r="27"/>

        <text class="objectiveText" x="520" y="364">CENTER</text>

      </g>

      <g id="obj3">

        <circle class="objective" cx="655" cy="535" r="27"/>

        <text class="objectiveText" x="655" y="539">BRIDGE</text>

      </g>

      <!-- ORDERS -->

      <g id="orders"></g>

      <!-- UNITS -->

      <g id="units"></g>

      <!-- CAPTURE AREAS -->

      <circle id="capture1" class="capture" cx="475" cy="170" r="40"/>

      <circle id="capture2" class="capture" cx="520" cy="360" r="40"/>

      <circle id="capture3" class="capture" cx="655" cy="535" r="40"/>

    </svg>

  </div>

  <div id="bottom">

    <div id="info">

      <div id="selected">No unit selected</div>

      <div id="stats">Tap a brigade to select it.</div>

      <div id="message">Drag from a selected brigade to give it an order.</div>

    </div>

    <div id="hint">

      TAP<br>

      to select<br><br>

      DRAG<br>

      to move

    </div>

  </div>

</div>

<script>

const svg = document.getElementById("map");

const unitsLayer = document.getElementById("units");

const ordersLayer = document.getElementById("orders");

const playButton = document.getElementById("play");

const resetButton = document.getElementById("reset");

const infoName = document.getElementById("selected");

const infoStats = document.getElementById("stats");

const message = document.getElementById("message");

const W = 1000;

const H = 650;

let playing = false;

let selected = null;

let drawing = false;

let dragStart = null;

let preview = null;

let lastTime = performance.now();

let battleTime = 0;

const initialUnits = [

  {id:"u1", name:"1st Brigade", side:"union", x:330,y:250, strength:100, morale:100, speed:42},

  {id:"u2", name:"2nd Brigade", side:"union", x:350,y:365, strength:100, morale:94, speed:40},

  {id:"u3", name:"3rd Brigade", side:"union", x:420,y:455, strength:100, morale:91, speed:39},

  {id:"u4", name:"4th Brigade", side:"union", x:500,y:525, strength:100, morale:88, speed:38},

  {id:"c1", name:"1st Confederate", side:"confed", x:720,y:175, strength:100, morale:100, speed:40},

  {id:"c2", name:"2nd Confederate", side:"confed", x:760,y:290, strength:100, morale:96, speed:39},

  {id:"c3", name:"3rd Confederate", side:"confed", x:790,y:390, strength:100, morale:93, speed:38},

  {id:"c4", name:"4th Confederate", side:"confed", x:760,y:500, strength:100, morale:89, speed:37}

];

let units = [];

function resetGame(){

  units = initialUnits.map(u => ({

    ...u,

    targetX:u.x,

    targetY:u.y,

    orderX:null,

    orderY:null,

    el:null

  }));

  battleTime = 0;

  playing = false;

  selected = null;

  drawing = false;

  preview = null;

  playButton.textContent = "▶ PLAY";

  render();

  updateInfo();

  setMessage("Tap a brigade to select it.");

}

function esc(s){

  return s.replace(/[&<>"']/g,m=>({

    "&":"&amp;",

    "<":"&lt;",

    ">":"&gt;",

    '"':"&quot;",

    "'":"&#39;"

  }[m]));

}

function render(){

  unitsLayer.innerHTML = "";

  units.forEach(u=>{

    const g = document.createElementNS("http://www.w3.org/2000/svg","g");

    g.setAttribute("class","unit " + u.side + (selected===u.id ? " selected":""));

    g.dataset.id=u.id;

    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");

    rect.setAttribute("class","unitBody");

    rect.setAttribute("x",u.x-28);

    rect.setAttribute("y",u.y-17);

    rect.setAttribute("width",56);

    rect.setAttribute("height",34);

    rect.setAttribute("rx",7);

    const text=document.createElementNS("http://www.w3.org/2000/svg","text");

    text.setAttribute("class","unitText");

    text.setAttribute("x",u.x);

    text.setAttribute("y",u.y+5);

    text.textContent=u.side==="union" ? "UNION" : "CSA";

    const bar=document.createElementNS("http://www.w3.org/2000/svg","rect");

    bar.setAttribute("class","strengthBar");

    bar.setAttribute("x",u.x-28);

    bar.setAttribute("y",u.y+21);

    bar.setAttribute("width",56);

    bar.setAttribute("height",5);

    bar.setAttribute("rx",2);

    const fill=document.createElementNS("http://www.w3.org/2000/svg","rect");

    fill.setAttribute("class","strengthFill");

    fill.setAttribute("x",u.x-28);

    fill.setAttribute("y",u.y+21);

    fill.setAttribute("width",56*(u.strength/100));

    fill.setAttribute("height",5);

    fill.setAttribute("rx",2);

    g.appendChild(rect);

    g.appendChild(text);

    g.appendChild(bar);

    g.appendChild(fill);

    g.addEventListener("pointerdown",e=>{

      e.stopPropagation();

      selectUnit(u.id);

      drawing=true;

      dragStart={x:u.x,y:u.y};

      preview={x:u.x,y:u.y};

      drawOrders();

    });

    unitsLayer.appendChild(g);

    u.el=g;

  });

  drawOrders();

}

function selectUnit(id){

  selected=id;

  render();

  updateInfo();

  const u=getSelected();

  if(u) setMessage("Selected " + u.name + ". Drag from it to give a movement order.");

}

function getSelected(){

  return units.find(u=>u.id===selected);

}

function updateInfo(){

  const u=getSelected();

  if(!u){

    infoName.textContent="No unit selected";

    infoStats.textContent="Tap a brigade to select it.";

    return;

  }

  infoName.textContent=u.name + " • " + (u.side==="union" ? "UNION" : "CONFEDERATE");

  infoStats.textContent =

    "Strength " + Math.round(u.strength) +

    " • Morale " + Math.round(u.morale) +

    " • " + (u.orderX!==null ? "Moving" : "Awaiting orders");

}

function setMessage(t){

  message.textContent=t;

}

function screenToMap(e){

  const pt=svg.createSVGPoint();

  pt.x=e.clientX;

  pt.y=e.clientY;

  const ctm=svg.getScreenCTM();

  const p=pt.matrixTransform(ctm.inverse());

  return {

    x:Math.max(0,Math.min(W,p.x)),

    y:Math.max(0,Math.min(H,p.y))

  };

}

svg.addEventListener("pointermove",e=>{

  if(!drawing) return;

  preview=screenToMap(e);

  drawOrders();

});

svg.addEventListener("pointerup",e=>{

  if(!drawing) return;

  const p=screenToMap(e);

  const u=getSelected();

  drawing=false;

  if(u){

    const distance=Math.hypot(p.x-u.x,p.y-u.y);

    if(distance>18){

      u.targetX=p.x;

      u.targetY=p.y;

      u.orderX=p.x;

      u.orderY=p.y;

      setMessage(u.name + " ordered to move.");

    }

  }

  preview=null;

  drawOrders();

  updateInfo();

});

svg.addEventListener("pointercancel",()=>{

  drawing=false;

  preview=null;

  drawOrders();

});

svg.addEventListener("pointerdown",e=>{

  if(e.target===svg){

    selected=null;

    render();

    updateInfo();

  }

});

function drawOrders(){

  ordersLayer.innerHTML="";

  units.forEach(u=>{

    if(u.orderX===null) return;

    const line=document.createElementNS("http://www.w3.org/2000/svg","path");

    line.setAttribute("class","arrow");

    const d="M "+u.x+" "+u.y+" L "+u.orderX+" "+u.orderY;

    line.setAttribute("d",d);

    ordersLayer.appendChild(line);

    const dx=u.orderX-u.x;

    const dy=u.orderY-u.y;

    const len=Math.hypot(dx,dy);

    if(len>5){

      const ux=dx/len;

      const uy=dy/len;

      const px=-uy;

      const py=ux;

      const ax=u.orderX;

      const ay=u.orderY;

      const points=[

        (ax)+" "+(ay),

        (ax-ux*22+px*9)+" "+(ay-uy*22+py*9),

        (ax-ux*22-px*9)+" "+(ay-uy*22-py*9)

      ].join(",");

      const head=document.createElementNS("http://www.w3.org/2000/svg","polygon");

      head.setAttribute("class","arrowHead");

      head.setAttribute("points",points);

      ordersLayer.appendChild(head);

    }

  });

  if(drawing && preview && selected){

    const u=getSelected();

    if(u){

      const line=document.createElementNS("http://www.w3.org/2000/svg","path");

      line.setAttribute("class","arrow");

      line.setAttribute("opacity",".65");

      line.setAttribute("d","M "+u.x+" "+u.y+" L "+preview.x+" "+preview.y);

      ordersLayer.appendChild(line);

    }

  }

}

function moveUnit(u,dt){

  if(u.orderX===null) return;

  const dx=u.orderX-u.x;

  const dy=u.orderY-u.y;

  const dist=Math.hypot(dx,dy);

  if(dist<2){

    u.x=u.orderX;

    u.y=u.orderY;

    u.orderX=null;

    u.orderY=null;

    setMessage(u.name+" has reached its objective.");

    return;

  }

  const amount=Math.min(dist,u.speed*dt);

  u.x += dx/dist*amount;

  u.y += dy/dist*amount;

}

function distance(a,b){

  return Math.hypot(a.x-b.x,a.y-b.y);

}

function combat(dt){

  const union=units.filter(u=>u.side==="union");

  const confed=units.filter(u=>u.side==="confed");

  union.forEach(a=>{

    confed.forEach(b=>{

      const d=distance(a,b);

      if(d<105){

        const damage=2.1*dt;

        b.strength=Math.max(0,b.strength-damage);

        b.morale=Math.max(0,b.morale-damage*.75);

        a.strength=Math.max(0,a.strength-damage*.55);

        a.morale=Math.max(0,a.morale-damage*.35);

      }

    });

  });

  units=units.filter(u=>u.strength>0);

  if(selected && !units.some(u=>u.id===selected)){

    selected=null;

  }

}

function simpleAI(dt){

  const confeds=units.filter(u=>u.side==="confed");

  const targets=units.filter(u=>u.side==="union");

  confeds.forEach(c=>{

    if(c.orderX!==null) return;

    if(!targets.length) return;

    let nearest=targets[0];

    let best=distance(c,nearest);

    targets.forEach(t=>{

      const d=distance(c,t);

      if(d<best){

        best=d;

        nearest=t;

      }

    });

    if(best<230){

      c.targetX=nearest.x;

      c.targetY=nearest.y;

      c.orderX=nearest.x;

      c.orderY=nearest.y;

    }

  });

}

function loop(now){

  const dt=Math.min(.05,(now-lastTime)/1000);

  lastTime=now;

  if(playing){

    battleTime+=dt;

    units.forEach(u=>moveUnit(u,dt));

    simpleAI(dt);

    combat(dt);

    render();

    updateInfo();

  }

  requestAnimationFrame(loop);

}

playButton.addEventListener("click",()=>{

  playing=!playing;

  playButton.textContent=playing ? "⏸ PAUSE" : "▶ PLAY";

  setMessage(

    playing

    ? "Battle underway. Select a brigade and issue orders."

    : "Battle paused."

  );

});

resetButton.addEventListener("click",resetGame);

resetGame();

requestAnimationFrame(loop);

</script>

</body>

</html>
